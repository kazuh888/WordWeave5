[package]
name = "wordweave5"
version = "0.6.0"
default-run = "wordweave5"
edition = "2021"
description = "Five-minute contextual English vocabulary practice for Windows"
license = "MIT"

# Cargo builds this offline fixture for integration tests on Windows and Unix.
[[bin]]
name = "wordweave-mock-codex"
path = "tests/support/mock_codex.rs"
test = false
bench = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
pulldown-cmark = { version = "=0.13.0", default-features = false }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow"] }
rfd = "=0.15.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
tts = "=0.26.1"
windows = { version = "=0.56.0", features = ["Foundation", "Foundation_Collections", "Media_Core", "Media_Playback", "Media_SpeechSynthesis", "Storage_Streams", "Win32_System_Registry"] }
cpal = "=0.15.3"
hound = "=3.5.1"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "gif", "jpeg"] }
base64 = "0.22"
qwen-audio = { path = "tools/qwen-audio", default-features = false, features = ["windows-credentials"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
tokio-util = "0.7"
zeroize = "1"
futures-util = "0.3"

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "1", features = ["macros", "test-util"] }

[profile.release]
lto = "thin"
strip = true
