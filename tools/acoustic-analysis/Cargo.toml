[package]
name = "acoustic-analysis"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "acoustic-test-child"
path = "tests/support/praat_child.rs"
test = false
bench = false
required-features = ["praat"]

[features]
default = []
praat = ["dep:sha2", "dep:tempfile", "dep:windows"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.56.0", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
