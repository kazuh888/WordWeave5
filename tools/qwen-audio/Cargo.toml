[package]
name = "qwen-audio"
version = "0.1.0"
edition = "2021"

[lib]
name = "qwen_audio"

[[bin]]
name = "qwen-audio"
path = "src/main.rs"
required-features = ["gui", "mcp", "windows-credentials", "windows-job"]

[features]
default = ["gui", "mcp", "windows-credentials", "windows-job"]
mcp = ["dep:uuid", "tokio/io-util", "tokio/io-std", "tokio/process"]
gui = ["mcp", "dep:eframe", "dep:rfd", "dep:image"]
windows-credentials = ["dep:windows", "windows/Win32_Foundation", "windows/Win32_Security_Credentials"]
windows-job = ["mcp", "dep:windows", "windows/Win32_Foundation", "windows/Win32_Security", "windows/Win32_System_JobObjects", "windows/Win32_System_Threading"]

[dependencies]
base64 = "0.22"
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = { version = "=0.15.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
uuid = { version = "1", optional = true, features = ["v4"] }
zeroize = "1"
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
windows = { version = "=0.56.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "test-util", "io-util"] }
